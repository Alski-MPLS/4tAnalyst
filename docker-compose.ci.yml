services:
  fwanalyst:
    image: fw-analyst-dev:latest
    container_name: fw_analyst
    working_dir: /opt/fw-analyst
    command: python -m fwanalyst_server
    environment:
      MCP_TRANSPORT: http
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8000"
      FW_ANALYST_TOKEN: ci-smoke-token
    ports:
      - 8000:8000

# No repo mounts — CI uses the built image
